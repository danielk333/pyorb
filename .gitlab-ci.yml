# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: python:3.10

stages:
  - test
  - release

# Prepare the development enviornment
.devsetup:
  before_script:
    - python -V
    # Prepare and activate virtualenv
    - pip install -U pip
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    # install the package and develop dependancies
    - pip install .[develop]
    - apt update

# Prepare the nominal usage enviornment
.setup:
  before_script:
    - python -V
    # Prepare and activate virtualenv
    - pip install -U pip
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    # install the package
    - pip install .


#######################
## Platforms testing ##

#Template for testing on python images,
# extend this for each python-platform
# the package is intended to work on
test:
  stage: test
  extends: .setup
  allow_failure: true
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
  script:
    - pip install pytest
    - pytest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


###############
## Releasing ##

# Compile documentation for publication
pages:
  stage: release
  extends: .devsetup
  script:
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  only:
    - tags

# Build and check integrity of distribution
# Then publish package on public PyPI
pypi:
  stage: release
  extends: .devsetup
  variables:
    #Use a gitlab variable to securly store the token
    PYPI_TOKEN: $PYPI_TOKEN
  script:
    - python -m build
    - python -m twine check dist/*
    - >
      TWINE_USERNAME=__token__
      TWINE_PASSWORD=$PYPI_TOKEN
      python -m twine upload dist/*
  artifacts:
    paths:
      - dist/*
  only:
    - tags
